<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Where to go?{% endblock %}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e6ed;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      background: rgba(26, 26, 46, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #64ffda;
      text-decoration: none;
      background: linear-gradient(135deg, #64ffda, #4dd0e1);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
      transition: all 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
      text-shadow: 0 0 30px rgba(100, 255, 218, 0.5);
    }

    .nav-links {
      display: flex;
      align-items: center;
    }

    .nav-links a {
      color: #a8b2d1;
      text-decoration: none;
      margin: 0 1.5rem;
      font-weight: 500;
      font-size: 1.1rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.3s ease;
      display: inline-block;
      position: relative;
      overflow: hidden;
    }

    .nav-links a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(100, 255, 218, 0.2), transparent);
      transition: left 0.5s;
    }

    .nav-links a:hover::before {
      left: 100%;
    }

    .nav-links a:hover {
      color: #64ffda;
      background: rgba(100, 255, 218, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(100, 255, 218, 0.2);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
      flex: 1;
    }

    h1, h2, h3 {
      color: #ccd6f6;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #64ffda, #8892b0);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(100, 255, 218, 0.5);
    }

    p {
      color: #8892b0;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    button, .btn {
      background: linear-gradient(135deg, #64ffda, #4dd0e1);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      color: #0a192f;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      text-decoration: none;
      display: inline-block;
      position: relative;
      overflow: hidden;
    }

    button::before, .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    button:hover::before, .btn:hover::before {
      left: 100%;
    }

    button:hover, .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(100, 255, 218, 0.4);
      background: linear-gradient(135deg, #4dd0e1, #64ffda);
    }

    #random-result {
      background: rgba(26, 26, 46, 0.6);
      border: 1px solid rgba(100, 255, 218, 0.3);
      border-radius: 12px;
      padding: 2rem;
      margin: 2rem 0;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    #random-result:hover {
      border-color: rgba(100, 255, 218, 0.5);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(-5px);
    }

    #random-result h3 {
      color: #64ffda;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    #random-result p {
      color: #a8b2d1;
      margin-bottom: 0.8rem;
    }

    .rating {
      color: #ffd700;
      font-size: 1.2rem;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    footer {
      background: rgba(12, 12, 12, 0.8);
      text-align: center;
      padding: 2rem;
      margin-top: 4rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #8892b0;
      backdrop-filter: blur(10px);
    }

    /* Анимация загрузки */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    main > * {
      animation: fadeInUp 0.6s ease-out;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .logo {
        font-size: 1.3rem;
      }

      .nav-links {
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-links a {
        margin: 0 0.5rem;
        font-size: 1rem;
      }

      main {
        padding: 0 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      #random-result {
        padding: 1.5rem;
      }
    }

    input, textarea, select {
      background: rgba(26, 26, 46, 0.8);
      border: 1px solid rgba(100, 255, 218, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #e0e6ed;
      font-size: 1rem;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 1rem;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #64ffda;
      box-shadow: 0 0 15px rgba(100, 255, 218, 0.3);
      background: rgba(26, 26, 46, 0.9);
    }

    input::placeholder, textarea::placeholder {
      color: #8892b0;
    }

    /* Стили для карточек */
    .card {
      background: rgba(26, 26, 46, 0.6);
      border: 1px solid rgba(100, 255, 218, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1rem 0;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: rgba(100, 255, 218, 0.4);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'index' %}" class="logo">Where Better Than Here</a>
      <div class="nav-links">
        <a href="{% url 'index' %}">Головна</a>
        <a href="{% url 'place_list' %}">Список місць</a>
        <a href="{% url 'add_place' %}">Додати місце</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}
    <h1>Куди піти?</h1>
    <p>Знайдіть ідеальне місце для вашого відпочинку</p>
    <button onclick="askRandom()">Випадкове місце</button>
    <div id="random-result"></div>
    {% endblock %}
  </main>

  <footer>
    © 2025, створено вами.
  </footer>

  <script>
    function askRandom() {
      const button = event.target;
      button.textContent = 'Завантаження...';
      button.disabled = true;

      fetch("{% url 'random_place' %}", {headers: {'x-requested-with': 'XMLHttpRequest'}})
        .then(r => r.json())
        .then(data => {
          const p = data.place;
          document.getElementById('random-result').innerHTML = `
            <h3>${p.name}</h3>
            <p>${p.description}</p>
            <p class="rating">Рейтинг: ${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</p>
          `;
          button.textContent = 'Випадкове місце';
          button.disabled = false;
        })
        .catch(error => {
          console.error('Error:', error);
          button.textContent = 'Випадкове місце';
          button.disabled = false;
        });
    }
  </script>
</body>
</html>
